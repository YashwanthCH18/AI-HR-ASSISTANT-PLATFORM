AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HR assistant employee scoped API and text chat
Parameters:
  DbHost: { Type: String }
  DbPort: { Type: String, Default: '3306' }
  DbName: { Type: String }
  DbUser: { Type: String }
  DbPassword: { Type: String, NoEcho: true }
  JwtSecret: { Type: String, NoEcho: true }
  GeminiApiKey: { Type: String, NoEcho: true, Default: '' }
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
Resources:
  EmployeeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
  EmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../..
      Handler: services/employee/lambda.handler
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          JWT_SECRET: !Ref JwtSecret
          GEMINI_API_KEY: !Ref GeminiApiKey
      Events:
        Root: { Type: Api, Properties: { RestApiId: !Ref EmployeeApi, Path: /, Method: ANY } }
        Proxy: { Type: Api, Properties: { RestApiId: !Ref EmployeeApi, Path: '/{proxy+}', Method: ANY } }
Outputs:
  ApiUrl:
    Value: !Sub 'https://${EmployeeApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
