AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HR assistant authentication and role router
Parameters:
  DbHost: { Type: String }
  DbPort: { Type: String, Default: '3306' }
  DbName: { Type: String }
  DbUser: { Type: String }
  DbPassword: { Type: String, NoEcho: true }
  JwtSecret: { Type: String, NoEcho: true }
  AdminBackendUrl: { Type: String }
  EmployeeBackendUrl: { Type: String }
  AllowedOrigins: { Type: String, Default: '*' }
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
Resources:
  RouterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../..
      Handler: services/router/lambda.handler
      Environment:
        Variables:
          NODE_ENV: production
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          JWT_SECRET: !Ref JwtSecret
          ADMIN_BACKEND_URL: !Ref AdminBackendUrl
          USER_BACKEND_URL: !Ref EmployeeBackendUrl
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          ENABLE_PUBLIC_SIGNUP: 'false'
      Events:
        Root: { Type: Api, Properties: { RestApiId: !Ref RouterApi, Path: /, Method: ANY } }
        Proxy: { Type: Api, Properties: { RestApiId: !Ref RouterApi, Path: '/{proxy+}', Method: ANY } }
Outputs:
  ApiUrl:
    Value: !Sub 'https://${RouterApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
